[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "groundcheck-jev"
version = "0.1.0"
description = "Calibrated grounding guardrail for RAG answers. Catches hallucinations in ~200ms for ~$23 per million checks."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Sharvil Saxena"}]
keywords = ["rag", "hallucination", "guardrail", "llm", "evaluation", "jev", "grounding"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["typesafe-sdk>=0.1.0"]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=8", "numpy>=1.24", "scikit-learn>=1.3", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/sharziki/groundcheck"

[project.scripts]
groundcheck = "groundcheck_jev.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
